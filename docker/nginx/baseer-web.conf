server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell is the release marker. Hash-named assets remain immutable, while
  # index.html must be revalidated so an open ERP session can learn of a safe
  # newer release without forcing a refresh during data entry.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }
  location = / {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }
}
