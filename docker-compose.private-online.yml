name: baseer-erp-private-online

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Every production image is supplied as an immutable image@sha256 digest.
    # The release manifest generated by CI is the source of the three Baseer
    # application image values; operators pin the two third-party images too.
    image: ${BASEER_POSTGRES_IMAGE:?BASEER_POSTGRES_IMAGE must be an immutable image@sha256 digest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${BASEER_DB_NAME:?BASEER_DB_NAME is required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BASEER_DB_BOOTSTRAP_PASSWORD:?BASEER_DB_BOOTSTRAP_PASSWORD is required}
      BASEER_APP_USER: ${BASEER_DB_APP_USER:?BASEER_DB_APP_USER is required}
      BASEER_APP_PASSWORD: ${BASEER_DB_APP_PASSWORD:?BASEER_DB_APP_PASSWORD is required}
    volumes:
      - baseer_private_postgres_data:/var/lib/postgresql/data
      - ./docker/baseer-private-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - database

  migrate:
    image: ${BASEER_MIGRATE_IMAGE:?BASEER_MIGRATE_IMAGE must be an immutable image@sha256 digest}
    restart: "no"
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://postgres:${BASEER_DB_BOOTSTRAP_PASSWORD:?BASEER_DB_BOOTSTRAP_PASSWORD is required}@postgres:5432/${BASEER_DB_NAME:?BASEER_DB_NAME is required}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  grant-app-access:
    image: ${BASEER_POSTGRES_IMAGE:?BASEER_POSTGRES_IMAGE must be an immutable image@sha256 digest}
    restart: "no"
    logging: *default-logging
    environment:
      PGPASSWORD: ${BASEER_DB_BOOTSTRAP_PASSWORD:?BASEER_DB_BOOTSTRAP_PASSWORD is required}
      POSTGRES_DB: ${BASEER_DB_NAME:?BASEER_DB_NAME is required}
      BASEER_APP_USER: ${BASEER_DB_APP_USER:?BASEER_DB_APP_USER is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - exec psql --host postgres --set=ON_ERROR_STOP=1 --username postgres --dbname "$$POSTGRES_DB" --file /docker-entrypoint-initdb.d/20-reconcile-baseer-app-access.sql
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/baseer-private-init:/docker-entrypoint-initdb.d:ro
    networks:
      - database

  api:
    image: ${BASEER_API_IMAGE:?BASEER_API_IMAGE must be an immutable image@sha256 digest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      BASEER_DEPLOYMENT_MODE: private-online
      BASEER_BIND_HOST: 0.0.0.0
      BASEER_API_PORT: "5200"
      # Only the TLS edge has this fixed address. Fastify therefore accepts
      # X-Forwarded-For exclusively from Caddy, never from another container.
      BASEER_TRUSTED_REVERSE_PROXY_IPS: "172.30.0.10"
      BASEER_ALLOW_PUBLIC_SIGNUP: "false"
      BASEER_SYSTEM_TENANT_CODE: ${BASEER_SYSTEM_TENANT_CODE:?BASEER_SYSTEM_TENANT_CODE is required}
      DATABASE_URL: postgresql://${BASEER_DB_APP_USER}:${BASEER_DB_APP_PASSWORD}@postgres:5432/${BASEER_DB_NAME}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      ATTENDANCE_PIN_PEPPER: ${ATTENDANCE_PIN_PEPPER:?ATTENDANCE_PIN_PEPPER is required}
      ATTENDANCE_QR_SECRET: ${ATTENDANCE_QR_SECRET:?ATTENDANCE_QR_SECRET is required}
      # Required for the two-week location-evidence privacy retention policy.
      # Run this on exactly one API instance; the database lease handles an
      # accidental replica overlap safely.
      BASEER_ATTENDANCE_LOCATION_RETENTION_SCHEDULER_ENABLED: ${BASEER_ATTENDANCE_LOCATION_RETENTION_SCHEDULER_ENABLED:?BASEER_ATTENDANCE_LOCATION_RETENTION_SCHEDULER_ENABLED must be true}
      BASEER_PUBLIC_DOMAIN: ${BASEER_PUBLIC_DOMAIN:?BASEER_PUBLIC_DOMAIN is required}
      BASEER_BACKUP_TARGET_LABEL: ${BASEER_BACKUP_TARGET_LABEL:?BASEER_BACKUP_TARGET_LABEL is required}
      # Company-archive jobs stay opt-in. Their encrypted artifacts live under
      # the private bind mount, never in the image, workspace, or web root.
      BASEER_BACKUP_WORKER_ENABLED: ${BASEER_BACKUP_WORKER_ENABLED:-false}
      BASEER_BACKUP_SCHEDULER_ENABLED: ${BASEER_BACKUP_SCHEDULER_ENABLED:-false}
      BASEER_BACKUP_ARCHIVE_STORAGE_ROOT: /var/lib/baseer/storage/backup-archives
      BASEER_ARCHIVE_APPLICATION_VERSION: ${BASEER_ARCHIVE_APPLICATION_VERSION:-}
      BASEER_ARCHIVE_SCHEMA_VERSION: ${BASEER_ARCHIVE_SCHEMA_VERSION:-}
      BASEER_ARCHIVE_KEK_KEYRING_V1: ${BASEER_ARCHIVE_KEK_KEYRING_V1:-}
      # All application files remain on this server, but only beneath the
      # explicitly mounted host directory. The API root filesystem stays read-only.
      BASEER_FILE_STORAGE_ENABLED: "true"
      BASEER_FILE_STORAGE_ROOT: /var/lib/baseer/storage
      BASEER_EMPLOYEE_DOCUMENT_STORAGE_ROOT: /var/lib/baseer/storage/hr
      BASEER_COMPANY_LOGO_STORAGE_ROOT: /var/lib/baseer/storage/logos
      BASEER_INBOUND_EVIDENCE_STORAGE_ROOT: /var/lib/baseer/storage/inbound
      BASEER_EMPLOYEE_DOCUMENT_ENCRYPTION_KEY: ${BASEER_EMPLOYEE_DOCUMENT_ENCRYPTION_KEY:?BASEER_EMPLOYEE_DOCUMENT_ENCRYPTION_KEY is required}
      BASEER_DOCUMENT_SCANNER_ENDPOINT: ${BASEER_DOCUMENT_SCANNER_ENDPOINT:?BASEER_DOCUMENT_SCANNER_ENDPOINT is required}
      # Central Google application configuration.  It is empty until the owner
      # moves approved values from the existing Google Cloud project.  Never
      # put a company OAuth grant, refresh token, or account ID here.
      BASEER_GOOGLE_OAUTH_CLIENT_ID: ${BASEER_GOOGLE_OAUTH_CLIENT_ID:-}
      BASEER_GOOGLE_OAUTH_CLIENT_SECRET: ${BASEER_GOOGLE_OAUTH_CLIENT_SECRET:-}
      BASEER_GOOGLE_OAUTH_REDIRECT_URI: ${BASEER_GOOGLE_OAUTH_REDIRECT_URI:-}
      BASEER_GOOGLE_ADS_DEVELOPER_TOKEN: ${BASEER_GOOGLE_ADS_DEVELOPER_TOKEN:-}
      BASEER_PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${BASEER_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
      # Remains false until the callback, account-selection and pilot gates are
      # delivered and the platform owner explicitly enables OAuth.
      BASEER_GOOGLE_OAUTH_ENABLED: ${BASEER_GOOGLE_OAUTH_ENABLED:-false}
      BASEER_GMAIL_OAUTH_ENABLED: ${BASEER_GMAIL_OAUTH_ENABLED:-false}
      BASEER_GMAIL_OAUTH_CLIENT_ID: ${BASEER_GMAIL_OAUTH_CLIENT_ID:-}
      BASEER_GMAIL_OAUTH_CLIENT_SECRET: ${BASEER_GMAIL_OAUTH_CLIENT_SECRET:-}
      BASEER_GMAIL_OAUTH_REDIRECT_URI: ${BASEER_GMAIL_OAUTH_REDIRECT_URI:-}
      BASEER_INBOUND_EVIDENCE_ENCRYPTION_KEY: ${BASEER_INBOUND_EVIDENCE_ENCRYPTION_KEY:-}
      BASEER_INBOUND_EVIDENCE_STORAGE_ENCRYPTION_KEY: ${BASEER_INBOUND_EVIDENCE_STORAGE_ENCRYPTION_KEY:-}
    depends_on:
      grant-app-access:
        condition: service_completed_successfully
    expose:
      - "5200"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${BASEER_STORAGE_HOST_PATH:?BASEER_STORAGE_HOST_PATH is required}
        target: /var/lib/baseer/storage
        read_only: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5200/v1/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - web
      - database

  web:
    image: ${BASEER_WEB_IMAGE:?BASEER_WEB_IMAGE must be an immutable image@sha256 digest}
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - web

  caddy:
    image: ${BASEER_CADDY_IMAGE:?BASEER_CADDY_IMAGE must be an immutable image@sha256 digest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging
    environment:
      BASEER_PUBLIC_DOMAIN: ${BASEER_PUBLIC_DOMAIN:?BASEER_PUBLIC_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.private-online:/etc/caddy/Caddyfile:ro
      - baseer_private_caddy_data:/data
      - baseer_private_caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      web:
        ipv4_address: 172.30.0.10

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  database:
    internal: true

volumes:
  baseer_private_postgres_data:
  baseer_private_caddy_data:
  baseer_private_caddy_config:
