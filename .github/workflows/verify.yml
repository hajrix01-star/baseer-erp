name: Verify BASEER ERP

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseer_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseer_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/baseer_erp_test?schema=public
      BASEER_SYSTEM_TENANT_CODE: baseer-ci-system
      # These names intentionally match the runtime configuration contract in
      # identity-token.service.ts and ai-credential-vault.ts. They are CI-only
      # fixtures, never deploy credentials.
      IDENTITY_JWT_SECRET: baseer-ci-identity-jwt-secret-at-least-32-chars
      AI_CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ATTENDANCE_PIN_PEPPER: baseer-ci-attendance-pin-pepper-at-least-32-chars
      ATTENDANCE_QR_SECRET: baseer-ci-attendance-qr-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --config apps/api/prisma.config.ts
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_ADMIN_URL }}
      - name: Prepare restricted test application role
        run: |
          CI_DATABASE_APP_PASSWORD=$(openssl rand -hex 32)
          echo "CI_DATABASE_APP_PASSWORD=$CI_DATABASE_APP_PASSWORD" >> "$GITHUB_ENV"
          CI_DATABASE_APP_PASSWORD="$CI_DATABASE_APP_PASSWORD" node scripts/prepare-ci-restricted-role.mjs
      - name: Use restricted test application role
        run: echo "DATABASE_URL=postgresql://baseer_ci_app:${CI_DATABASE_APP_PASSWORD}@localhost:5432/baseer_erp_test?schema=public" >> "$GITHUB_ENV"
      - run: git diff --exit-code -- apps/api/src/generated/prisma
      - run: git diff --check
      - run: npm run check:architecture
      - run: npm run check:web-api-transport
      - run: npm run check:library-migration-inventory
      - run: npm run check:dead-code
      - run: npm run check:nest-registration
      - run: npm run check:permissions
      - run: npm run check:authorization-consistency
      - run: npm run check:session-resilience
      - run: npm run check:hr-rls
      - run: npm run check:finance-rls
      - run: npm run check:administration-rls
      - run: npm run check:reports-rls
      - run: npm run check:decision-intelligence-rls
      - run: npm run check:command-center-rls
      - run: npm run check:ai-gate-b
      - run: npm run check:web-financial-boundaries
      - run: npm run check:web-dialog-conventions
      - run: npm run check:web-localization
      - run: npm run check:web-numeric-policy
      - run: npm run audit:ui-components -- --json
      - run: npm run check:ui-governance-registers
      - run: npm run check:ui-native-control-ratchet
      - run: npm run check:ui-inline-style-ratchet
      - run: npm run check --workspace @baseer-erp/contracts
      - run: npm run build --workspace @baseer-erp/contracts
      - run: npm run build --workspace @baseer-erp/output-platform
      - run: npm run check --workspace @baseer-erp/api
      - run: npm run check --workspace @baseer-erp/web
      - run: npm run build --workspace @baseer-erp/api
      - name: Verify separated API and migration images
        run: |
          docker build --target runtime --tag baseer-erp-api-runtime-check .
          docker build --target migrate --tag baseer-erp-migrate-check .
          docker run --rm --entrypoint node baseer-erp-api-runtime-check -e 'for (const name of ["prisma", "@prisma/config", "deepmerge-ts"]) { try { require.resolve(name); process.exit(1); } catch (error) { if (error.code !== "MODULE_NOT_FOUND") throw error; } } require.resolve("@prisma/client"); require.resolve("@prisma/adapter-pg");'
          docker run --rm --entrypoint npx baseer-erp-migrate-check prisma --version
      - run: node scripts/run-auth-throttling-verification.mjs
      - run: npm run verify:administration-lifecycle
      - run: npm run verify:finance-gate-b-db
      - run: npm run verify:finance-accounts-http
      - run: npm run verify:finance-period-race
      - run: npm run verify:ai-gate-b-db
      - run: npm run verify:ai-gate-b-http
      - run: npm run verify:daily-sales-db
      - run: npm run verify:daily-sales-http
      - name: Verify attendance HTTP boundaries and retention
        run: node scripts/run-attendance-http-verification.mjs
      - run: npm run build --workspace @baseer-erp/web
      - run: npm run verify:web-budget
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: git diff --exit-code -- apps/api/src/generated/prisma
      - run: git diff --check
      - name: Audit deployable runtime dependency graph
        run: npm run audit:runtime-dependencies
      - name: Monitor isolated Prisma toolchain advisory
        run: npm run check:prisma-advisory-status
      - name: Verify immutable private-online release contract
        run: node scripts/check-release-provenance-contract.mjs

  web-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Workspace packages publish their runtime exports from dist/.  Build the
      # contract before starting Vite so this clean CI checkout exercises the
      # same import boundary as the production web image.
      - run: npm run build --workspace @baseer-erp/contracts
      - name: Run web accessibility and interaction acceptance tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e --workspace @baseer-erp/web
      - name: Preserve Playwright failure evidence
        # `act` cannot provide GitHub's short-lived artifact runtime token.
        # The Linux parity runner marks only its local invocation with this
        # flag, while GitHub Actions continues to preserve evidence on every
        # outcome.
        if: always() && env.BASEER_CI_PARITY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baseer-web-acceptance-${{ github.sha }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  release-api:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [quality, web-acceptance]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/baseer-erp-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

  release-migrate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [quality, web-acceptance]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/baseer-erp-migrate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

  release-web:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [quality, web-acceptance]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/baseer-erp-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

  release-manifest:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [release-api, release-migrate, release-web]
    runs-on: ubuntu-latest
    steps:
      - name: Create an archiveable immutable release manifest
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/baseer-erp-api@${{ needs.release-api.outputs.digest }}
          MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/baseer-erp-migrate@${{ needs.release-migrate.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/baseer-erp-web@${{ needs.release-web.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node -e "const { writeFileSync } = require('node:fs'); const images = { api: process.env.API_IMAGE, migrate: process.env.MIGRATE_IMAGE, web: process.env.WEB_IMAGE }; const manifest = { schemaVersion: 1, source: { repository: process.env.SOURCE_REPOSITORY, commit: process.env.SOURCE_COMMIT }, images, attestations: { provenance: 'OCI provenance attached by docker/build-push-action@v6 (mode=max)', sbom: 'OCI SBOM attached by docker/build-push-action@v6' } }; writeFileSync('baseer-release-manifest.json', JSON.stringify(manifest, null, 2) + '\\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: baseer-release-manifest-${{ github.sha }}
          path: baseer-release-manifest.json
          retention-days: 90
